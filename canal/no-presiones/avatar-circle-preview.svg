<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<defs><clipPath id="c"><circle cx="400" cy="400" r="400"/></clipPath></defs>
<rect width="800" height="800" fill="#303030"/><g clip-path="url(#c)">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF2A2A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="#05070A"/>
  <circle cx="400" cy="400" r="380" fill="url(#glow)"/>
  <!-- the button: a red key with a hard shadow, the one thing the channel asks you not to press -->
  <rect x="140" y="170" width="520" height="520" rx="70" fill="#3A0004"/>
  <rect x="140" y="140" width="520" height="520" rx="70" fill="#FF2A2A" stroke="#F8FAFC" stroke-width="20"/>
  <text x="400" y="470" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="230" fill="#F8FAFC">NO</text>
  <!-- a dose line under the key, like the counter on the videos -->
  <rect x="140" y="712" width="520" height="16" rx="8" fill="#FF2A2A"/>

</g></svg>