  <text x="820" y="346" text-anchor="middle" font-family="'Fragment Mono', 'DejaVu Sans Mono', monospace" font-size="36" fill="#FFE600" letter-spacing="3">UN FALLO REAL POR VÍDEO. TÚ ESTÁS AHÍ.</text>
